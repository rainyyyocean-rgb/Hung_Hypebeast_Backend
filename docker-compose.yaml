version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hypebeast_postgres_container
    restart: always
    # Docker tự động đọc file .env cùng cấp thư mục
    # và điền vào các biến ${...} dưới đây
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: